<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAG Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --t: 0.75s cubic-bezier(0.4, 0, 0.2, 1);
      --red: #c0392b;
      --red-hover: #a93226;
      --input-bg: #fce4e4;
      --output-bg: #f7f7f7;
      --text: #111;
      --muted: #666;
      --radius: 999px;
      --radius-box: 12px;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--text);
      background: #fff;
    }

    /* ── Page shell ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 1.5rem;
    }

    /* ── Input wrapper: centered by default ── */
    .input-section {
      width: 100%;
      max-width: 700px;
      margin-top: auto;
      margin-bottom: auto;
      transition: margin var(--t);
    }

    body.has-result .input-section {
      margin-top: 3rem;
      margin-bottom: 0;
    }

    .input-label {
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 0.6rem;
      display: block;
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    input[type="text"] {
      flex: 1;
      padding: 0.75rem 1.25rem;
      background: var(--input-bg);
      border: none;
      border-radius: var(--radius);
      font-size: 1rem;
      color: var(--text);
      outline: none;
      transition: box-shadow 0.2s;
    }

    input[type="text"]:focus {
      box-shadow: none;
    }

    input[type="text"]::placeholder {
      color: #c0a0a0;
    }

    .submit-btn {
      flex-shrink: 0;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: none;
      background: var(--red);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, transform 0.15s;
    }

    .submit-btn:hover { background: var(--red-hover); }
    .submit-btn:active { transform: scale(0.93); }
    .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .submit-btn svg {
      width: 20px;
      height: 20px;
    }

    /* ── Timer ── */
    .timer-row {
      width: 100%;
      max-width: 700px;
      display: flex;
      align-items: center;
      gap: 0.6rem;

      /* collapsed so it takes zero layout space initially */
      height: 0;
      overflow: hidden;
      margin-top: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity var(--t), margin var(--t);
    }

    body.has-result .timer-row {
      height: auto;
      overflow: visible;
      margin-top: 1.2rem;
      opacity: 1;
      pointer-events: auto;
    }

    .timer-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--red);
      flex-shrink: 0;
    }

    body.has-answer .timer-dot,
    body.has-error  .timer-dot {
      background: #aaa;
      animation: none;
    }

    body.has-result:not(.has-answer):not(.has-error) .timer-dot {
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.35; transform: scale(0.7); }
    }

    .timer-text {
      font-size: 0.82rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    /* ── Output section ── */
    .output-section {
      width: 100%;
      max-width: 700px;

      /* collapsed so it takes zero layout space initially */
      height: 0;
      overflow: hidden;
      margin-top: 0;
      margin-bottom: 0;
      opacity: 0;
      pointer-events: none;
      transform: translateY(12px);
      transition: opacity var(--t), transform var(--t), margin var(--t);
    }

    body.has-result .output-section {
      height: auto;
      overflow: visible;
      margin-top: 1rem;
      margin-bottom: 3rem;
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .output-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 0.6rem;
    }

    .output-label {
      font-size: 1.4rem;
      font-weight: 600;
    }

    /* ── Print button ── */
    .print-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-size: 0.82rem;
      display: none;
      align-items: center;
      gap: 0.35rem;
      padding: 0;
      transition: color 0.2s;
    }

    .print-btn:hover { color: var(--text); }

    .print-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    body.has-answer .print-btn { display: inline-flex; }

    .output-box {
      background: var(--output-bg);
      border-radius: var(--radius-box);
      min-height: 260px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
    }

    /* ── Shimmer loading ── */
    .shimmer-wrap {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .shimmer-line {
      height: 14px;
      border-radius: 6px;
      background: linear-gradient(90deg, #e0e0e0 25%, #efefef 50%, #e0e0e0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }

    .shimmer-line:nth-child(1) { width: 85%; }
    .shimmer-line:nth-child(2) { width: 70%; }
    .shimmer-line:nth-child(3) { width: 90%; }
    .shimmer-line:nth-child(4) { width: 60%; }
    .shimmer-line:nth-child(5) { width: 78%; }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Markdown output ── */
    .answer-content {
      display: none;
      line-height: 1.7;
      font-size: 0.97rem;
    }

    body.has-answer .shimmer-wrap  { display: none; }
    body.has-answer .answer-content { display: block; }

    .answer-content h1,
    .answer-content h2,
    .answer-content h3 {
      margin-top: 1.1rem;
      margin-bottom: 0.4rem;
      font-weight: 600;
    }

    .answer-content h2 { font-size: 1.1rem; }
    .answer-content h3 { font-size: 1rem; }

    .answer-content p  { margin-bottom: 0.7rem; }
    .answer-content ul,
    .answer-content ol { margin-left: 1.4rem; margin-bottom: 0.7rem; }
    .answer-content li { margin-bottom: 0.3rem; }

    .answer-content strong { font-weight: 600; }
    .answer-content em    { font-style: italic; }

    .answer-content code {
      background: #ececec;
      border-radius: 4px;
      padding: 0.1em 0.35em;
      font-size: 0.9em;
      font-family: 'Menlo', 'Consolas', monospace;
    }

    /* ── Error state ── */
    .error-msg {
      color: var(--red);
      font-size: 0.95rem;
      display: none;
    }

    body.has-error .shimmer-wrap { display: none; }
    body.has-error .error-msg    { display: block; }

    /* ── Sources ── */
    .sources-section {
      margin-top: 0.9rem;
    }

    .sources-toggle {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.82rem;
      cursor: pointer;
      padding: 0;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: color 0.2s;
    }

    .sources-toggle:hover { color: var(--text); }

    .sources-toggle .chevron {
      display: inline-block;
      transition: transform 0.25s;
    }

    .sources-open .chevron { transform: rotate(180deg); }

    .sources-list {
      display: none;
      flex-direction: column;
      gap: 0.75rem;
      margin-top: 0.6rem;
    }

    .sources-open .sources-list { display: flex; }

    .source-card {
      background: #f0f0f0;
      border-radius: 8px;
      padding: 0.8rem 1rem;
      font-size: 0.82rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .source-card .source-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.25rem;
      font-size: 0.85rem;
    }

    .source-card .source-score {
      display: inline-block;
      background: #ddd;
      border-radius: 4px;
      padding: 0.05rem 0.4rem;
      font-size: 0.75rem;
      margin-bottom: 0.4rem;
      color: #444;
    }

    .source-card .source-content {
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* ── Print ── */
    @media print {
      @page { margin: 1.8cm 2.2cm; }

      *, *::before, *::after {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      body {
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #111;
      }

      /* Hide all UI chrome */
      .input-section,
      .timer-row,
      .print-btn,
      .sources-toggle,
      .shimmer-wrap { display: none !important; }

      .page {
        display: block;
        padding: 0;
        min-height: unset;
      }

      .output-section {
        height: auto !important;
        overflow: visible !important;
        opacity: 1 !important;
        transform: none !important;
        width: 100%;
        max-width: 100%;
        margin: 0;
      }

      /* Subtle "Output" label */
      .output-header { margin-bottom: 0.5rem; }
      .output-label {
        font-size: 0.7rem;
        font-weight: 500;
        color: #999;
        text-transform: uppercase;
        letter-spacing: 0.1em;
      }

      /* Question as bold header above the box */
      .print-question {
        display: block !important;
        font-size: 1.2rem;
        font-weight: 700;
        color: #111;
        line-height: 1.4;
        margin-bottom: 1rem;
        padding-bottom: 0.75rem;
        border-bottom: 1.5px solid #ddd;
      }

      /* Keep the gray card */
      .output-box {
        background: #f7f7f7 !important;
        border-radius: 12px !important;
        min-height: unset;
        padding: 1.4rem 1.6rem !important;
        overflow: visible;
        break-inside: avoid;
      }

      /* Answer content — preserve all markdown styling */
      .answer-content {
        display: block !important;
      }

      .answer-content h1,
      .answer-content h2,
      .answer-content h3 { page-break-after: avoid; }

      /* Sources — toggle hidden, list always shown if opened before print */
      .sources-section {
        margin-top: 1.1rem;
      }

      .sources-list {
        display: flex !important;
        margin-top: 0;
      }

      .source-card {
        background: #efefef !important;
        border-radius: 8px !important;
        break-inside: avoid;
      }

      .source-card .source-score {
        background: #e0e0e0 !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">

    <!-- Input -->
    <section class="input-section">
      <label class="input-label" for="question-input">Input</label>
      <div class="input-row">
        <input
          type="text"
          id="question-input"
          placeholder="Ask a question about the manual…"
          autocomplete="off"
        />
        <button class="submit-btn" id="submit-btn" title="Send">
          <!-- Right-pointing send arrow -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" fill="none">
            <path d="M5 12h14M13 6l6 6-6 6" stroke="#fff" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </section>

    <!-- Timer -->
    <div class="timer-row" id="timer-row">
      <span class="timer-dot"></span>
      <span class="timer-text" id="timer-text">Generating…</span>
    </div>

    <!-- Output -->
    <section class="output-section" id="output-section" aria-live="polite">
      <div class="output-header">
        <span class="output-label">Output</span>
        <button class="print-btn" id="print-btn" title="Save as PDF">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 9V3h12v6M6 18H4a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1h16a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1h-2M6 14h12v7H6v-7z"
              stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span id="print-btn-label">Save as PDF</span>
        </button>
      </div>
      <div class="output-box">
        <p class="print-question" id="print-question" style="display:none"></p>
        <div class="shimmer-wrap" aria-hidden="true">
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
          <div class="shimmer-line"></div>
        </div>
        <div class="answer-content" id="answer-content"></div>
        <p class="error-msg" id="error-msg"></p>
      </div>

      <!-- Sources -->
      <div class="sources-section" id="sources-section" style="display:none">
        <button class="sources-toggle" id="sources-toggle" aria-expanded="false">
          <span class="chevron">▾</span>
          <span id="sources-label">Show sources</span>
        </button>
        <div class="sources-list" id="sources-list"></div>
      </div>
    </section>

  </div>

  <script>
    const API_URL = 'http://127.0.0.1:8000/api/rag/question';

    const input         = document.getElementById('question-input');
    const submitBtn     = document.getElementById('submit-btn');
    const answerEl      = document.getElementById('answer-content');
    const errorEl       = document.getElementById('error-msg');
    const sourcesSec    = document.getElementById('sources-section');
    const sourcesToggle = document.getElementById('sources-toggle');
    const sourcesList   = document.getElementById('sources-list');
    const sourcesLabel  = document.getElementById('sources-label');
    const timerText     = document.getElementById('timer-text');
    const printBtn      = document.getElementById('print-btn');
    const printBtnLabel = document.getElementById('print-btn-label');
    const printQuestion = document.getElementById('print-question');

    let isLoading   = false;
    let timerStart  = null;
    let timerHandle = null;

    /* ── Timer helpers ── */
    function startTimer() {
      timerStart = performance.now();
      timerText.textContent = 'Generating…  0.0s';
      timerHandle = setInterval(() => {
        const elapsed = ((performance.now() - timerStart) / 1000).toFixed(1);
        timerText.textContent = `Generating…  ${elapsed}s`;
      }, 100);
    }

    function stopTimer(label) {
      clearInterval(timerHandle);
      timerHandle = null;
      if (timerStart !== null) {
        const elapsed = ((performance.now() - timerStart) / 1000).toFixed(1);
        timerText.textContent = `${label}  ${elapsed}s`;
        timerStart = null;
      }
    }

    function clearTimer() {
      clearInterval(timerHandle);
      timerHandle = null;
      timerStart  = null;
      timerText.textContent = 'Generating…';
    }

    /* ── Submit ── */
    async function submit() {
      const question = input.value.trim();
      if (!question || isLoading) return;

      isLoading = true;
      submitBtn.disabled = true;

      // Clear previous result states, enter loading state
      document.body.classList.remove('has-answer', 'has-error');
      document.body.classList.add('has-result');

      // Reset sources
      sourcesSec.style.display = 'none';
      sourcesSec.classList.remove('sources-open');
      sourcesToggle.setAttribute('aria-expanded', 'false');
      sourcesList.innerHTML = '';

      // Clear previous answer/error
      answerEl.innerHTML = '';
      errorEl.textContent = '';

      startTimer();

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });

        if (!res.ok) throw new Error(`Server error: ${res.status}`);

        const data = await res.json();

        stopTimer('Generated in');

        // Render markdown answer
        answerEl.innerHTML = marked.parse(data.answer ?? '');
        printQuestion.textContent = `Q: ${question}`;
        document.body.classList.add('has-answer');

        // Render sources
        if (data.sources && data.sources.length > 0) {
          sourcesLabel.textContent = `Show sources (${data.sources.length})`;
          sourcesList.innerHTML = data.sources.map(s => `
            <div class="source-card">
              <div class="source-title">${escapeHtml(s.title)}</div>
              <span class="source-score">${Math.round(s.score * 100)}% relevant</span>
              <div class="source-content">${escapeHtml(s.content)}</div>
            </div>
          `).join('');
          sourcesSec.style.display = 'block';
        }

      } catch (err) {
        stopTimer('Failed after');
        errorEl.textContent = err.message || 'Something went wrong. Is the API running?';
        document.body.classList.add('has-error');
      } finally {
        isLoading = false;
        submitBtn.disabled = false;
      }
    }

    /* ── Print (html2canvas → jsPDF, single-page, exact visual) ── */
    printBtn.addEventListener('click', async () => {
      printBtn.disabled = true;
      printBtnLabel.textContent = 'Generating…';

      const pageEl = document.querySelector('.page');

      // Collapse min-height so the canvas is exactly as tall as the content
      pageEl.style.minHeight = '0';

      // Let layout settle
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

      try {
        const canvas = await html2canvas(pageEl, {
          scale: 2,                // 2× for sharp text
          useCORS: true,
          backgroundColor: '#ffffff',
          windowWidth: document.documentElement.clientWidth,
        });

        // Convert canvas pixels → mm (96 dpi base, scale 2)
        const px2mm = 25.4 / (96 * 2);
        const pdfW  = canvas.width  * px2mm;
        const pdfH  = canvas.height * px2mm;

        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: [pdfW, pdfH],   // exact content dimensions, no A4
        });

        pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, pdfW, pdfH);

        const q = input.value.trim();
        pdf.save(q ? `RAG - ${q.slice(0, 60)}.pdf` : 'RAG Answer.pdf');

      } finally {
        pageEl.style.minHeight = '';
        printBtn.disabled = false;
        printBtnLabel.textContent = 'Save as PDF';
      }
    });

    /* ── Reset ── */
    function reset() {
      document.body.classList.remove('has-result', 'has-answer', 'has-error');
      answerEl.innerHTML = '';
      errorEl.textContent = '';
      sourcesSec.style.display = 'none';
      sourcesSec.classList.remove('sources-open');
      sourcesList.innerHTML = '';
      printQuestion.textContent = '';
      input.value = '';
      clearTimer();
    }

    /* ── Sources toggle ── */
    sourcesToggle.addEventListener('click', () => {
      const open = sourcesSec.classList.toggle('sources-open');
      sourcesToggle.setAttribute('aria-expanded', String(open));
      sourcesLabel.textContent = open
        ? sourcesLabel.textContent.replace('Show', 'Hide')
        : sourcesLabel.textContent.replace('Hide', 'Show');
    });

    /* ── Events ── */
    submitBtn.addEventListener('click', submit);

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') submit();
    });

    // Only reset on an explicit click/tap on the input, and ONLY when a
    // result (or error) is fully shown — never while the API is loading.
    // This prevents alt-tab / accidental focus from wiping the result.
    input.addEventListener('pointerdown', () => {
      if (
        document.body.classList.contains('has-answer') ||
        document.body.classList.contains('has-error')
      ) {
        reset();
      }
    });

    /* ── Utility ── */
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
